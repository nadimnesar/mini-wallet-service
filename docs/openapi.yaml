openapi: 3.1.0
info:
  title: Mini Wallet Service
  version: 0.0.1
  description: All amounts are integer poisha (1 BDT = 100 poisha). The API speaks only application/json; any other Content-Type is 415 UNSUPPORTED_MEDIA_TYPE and an Accept header that excludes JSON is 406 NOT_ACCEPTABLE, both in the standard error format.
servers:
  - url: '{baseUrl}'
    description: MiniWallet Collection Variables
    variables:
      baseUrl:
        default: http://localhost:8080
        description: Scheme, host and port of the service

paths:
  /api/v1/wallets:
    post:
      summary: Create a wallet
      operationId: createWallet
      tags: [Wallets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWalletRequest' }
      responses:
        '201':
          description: Wallet created with balance 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: DUPLICATE_PHONE (a wallet with this phone already exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/wallets/{phone}:
    get:
      summary: Get a wallet's details (no balance; see the balance endpoint)
      operationId: getWallet
      tags: [Wallets]
      parameters:
        - name: phone
          in: path
          required: true
          schema: { type: string, example: '01712345678', description: 'Wallet phone number in any accepted format' }
      responses:
        '200':
          description: Wallet found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/wallets/{phone}/balance:
    get:
      summary: Get a wallet's balance
      operationId: getBalance
      tags: [Wallets]
      parameters:
        - name: phone
          in: path
          required: true
          schema: { type: string, example: '01712345678', description: 'Wallet phone number in any accepted format' }
      responses:
        '200':
          description: Balance of the wallet, from its latest ledger entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/wallets/add-money:
    post:
      summary: Request to add money from a card payment (asynchronous)
      description: >-
        Validates the request and queues it; the card gateway is checked and the wallet credited afterwards by a worker.
        Poll the Location URL for the outcome. A gateway outage, a payment not captured yet or a payment the gateway does not
        know yet is retried with backoff (default: after 5 s, 30 s, 2 min, 10 min and 30 min, so up to 6 attempts) before
        the request fails. Everything that needs no gateway (amount limits,
        wallet, unused gateway_ref) is still rejected immediately with the errors below.
      operationId: addMoney
      tags: [Wallets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMoneyRequest' }
      responses:
        '202':
          description: Request accepted, status PENDING (an idempotent replay returns the same request with its current status)
          headers:
            Location:
              description: URL of the request's status
              schema: { type: string, example: '/api/v1/wallets/add-money/0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddMoneyStatusResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: DUPLICATE_GATEWAY_REF (already credited, or already queued by another request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: SYSTEM_WALLET_NOT_ALLOWED (wallet is not a customer wallet) or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: SERVICE_BUSY (a row lock was not granted within the database lock timeout; nothing was written, retry with the same key). Carries Retry-After.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/wallets/add-money/{request_id}:
    get:
      summary: Status of an add-money request
      operationId: getAddMoneyRequest
      tags: [Wallets]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The request and its current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddMoneyStatusResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: ADD_MONEY_REQUEST_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/transfers:
    post:
      summary: Transfer money between two wallets
      operationId: transfer
      tags: [Transfers]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422':
          description: INSUFFICIENT_BALANCE (balance must cover amount + fee), SAME_WALLET_TRANSFER, SYSTEM_WALLET_NOT_ALLOWED (sender or receiver is not a customer wallet) or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: SERVICE_BUSY (a row lock was not granted within the database lock timeout; nothing was written, retry with the same key). Carries Retry-After.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/wallets/{phone}/transactions:
    get:
      summary: List a wallet's transactions, newest first (in ledger order)
      operationId: listLedgerEntries
      tags: [Wallets]
      parameters:
        - { name: phone, in: path, required: true, schema: { type: string, example: '01712345678', description: Wallet phone number in any accepted format } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EntryType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/transactions/{transactionId}:
    get:
      summary: Get one transaction with all of its ledger entries
      operationId: getTransactionDetails
      tags: [Transactions]
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }

  /actuator/health/liveness:
    get:
      summary: Liveness probe (the process is up)
      operationId: getLiveness
      tags: [Health]
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /actuator/health/readiness:
    get:
      summary: Readiness probe (the database answers; RabbitMQ is deliberately not checked, add-money is still accepted while the broker is down)
      operationId: getReadiness
      tags: [Health]
      description: Used as the docker compose healthcheck of the app. No other actuator endpoint is exposed, and no component details are returned.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Same key and body replays the stored result; same key with a different body returns 422. A key identifies one attempt: a stored business rejection (e.g. INSUFFICIENT_BALANCE) is replayed for that key, so retry with a new key after the cause is fixed.'
      schema: { type: string, minLength: 1, maxLength: 255, example: 'add-money-0001' }

  responses:
    Error:
      description: Error (see error.code)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN] }

    Amount:
      type: integer
      format: int64
      description: Poisha. The minimum and the single-transaction maximum come from the limits table (default 100 and 2500000); for a transfer it applies to the amount, the fee is charged on top. Outside them the error is INVALID_AMOUNT (400).

    PaymentMethod:
      type: string
      enum: [VISA, MASTERCARD]

    TransactionType:
      type: string
      enum: [ADD_MONEY, TRANSFER]

    EntryType:
      type: string
      description: Business meaning of one ledger entry (a debit or credit leg)
      enum: [ADD_MONEY, GATEWAY_CLEARING, TRANSFER_IN, TRANSFER_OUT, FEE_IN, FEE_OUT]

    CreateWalletRequest:
      type: object
      required: [user_id, phone, type]
      properties:
        user_id: { type: string, format: uuid, example: '0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b', description: 'Owner. Any UUID: nothing is reserved and one user may own any number of wallets of any type. The phone is the only uniqueness rule' }
        phone:
          type: string
          pattern: '^(?:\+?880|0)?(1\d{9})$'
          description: Any valid Bangladeshi mobile number, the same rule for every type. Accepts 1XXXXXXXXX, 01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX; stored as 01XXXXXXXXX; unique per wallet (409 DUPLICATE_PHONE)
          example: '+8801712345678'
        type:
          type: string
          enum: [ASSET, EXPENSE, REVENUE, EQUITY, LIABILITY]
          description: Account class, required (no default). Any user may create any type for now (role-based permissions will come later). LIABILITY is a customer wallet; no add-money or transfer flow can use the other types
          example: LIABILITY

    WalletResponse:
      type: object
      properties:
        wallet_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: Owner of the wallet }
        phone: { type: string, example: '01712345678', description: The wallet's external identity; unique per wallet }
        currency: { type: string, enum: [BDT] }
        type:
          type: string
          enum: [ASSET, EXPENSE, REVENUE, EQUITY, LIABILITY]
          description: Account class. Customer wallets are LIABILITY; the seeded system accounts are REVENUE (transfer fees) and ASSET (gateway clearing)
        created_at: { type: string, format: date-time }

    BalanceResponse:
      type: object
      properties:
        wallet_id: { type: string, format: uuid }
        phone: { type: string, example: '01712345678' }
        currency: { type: string, enum: [BDT] }
        balance: { type: integer, format: int64, description: 'Poisha; the balance_after of the latest ledger entry, 0 if none' }
        updated_at: { type: string, format: date-time, description: When the balance last changed (latest ledger entry); the wallet's creation time if it never has }

    AddMoneyRequest:
      type: object
      required: [phone, amount, gateway_ref, payment_method]
      properties:
        phone: { type: string, example: '01712345678' }
        amount: { $ref: '#/components/schemas/Amount' }
        gateway_ref:
          type: string
          format: uuid
          example: '0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b'
          description: Payment reference from the card gateway; credits only once. The mock gateway picks the outcome from a reserved prefix (see README); this example is captured
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }

    AddMoneyStatusResponse:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
          description: PENDING until the worker finishes (including while it waits for a retry); COMPLETED and FAILED are final
        wallet_id: { type: string, format: uuid }
        phone: { type: string, example: '01712345678' }
        amount: { type: integer, format: int64 }
        gateway_ref: { type: string, format: uuid }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        attempts: { type: integer, description: Processing attempts made so far }
        transaction_id: { type: [string, 'null'], format: uuid, description: Set once COMPLETED }
        balance: { type: [integer, 'null'], format: int64, description: Wallet balance right after the credit; set once COMPLETED }
        error_code:
          type: [string, 'null']
          description: >-
            Set once FAILED: PAYMENT_DECLINED, PAYMENT_PENDING (still not captured after every attempt), PAYMENT_NOT_FOUND, PAYMENT_MISMATCH, SYSTEM_WALLET_NOT_ALLOWED, DUPLICATE_GATEWAY_REF
            or INVALID_AMOUNT, or PAYMENT_GATEWAY_ERROR once the retries ran out. On a PENDING request that is waiting for a retry it is
            the last failure
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TransferRequest:
      type: object
      required: [from_phone, to_phone, amount]
      properties:
        from_phone: { type: string, example: '01712345678', description: 'Accepts 1XXXXXXXXX, 01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX; normalized to 01XXXXXXXXX' }
        to_phone: { type: string, example: '01712345678', description: 'Accepts 1XXXXXXXXX, 01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX; normalized to 01XXXXXXXXX' }
        amount: { $ref: '#/components/schemas/Amount' }
        note: { type: string, minLength: 1, maxLength: 255 }

    TransferResponse:
      type: object
      properties:
        transfer_id: { type: string, format: uuid }
        from_wallet_id: { type: string, format: uuid }
        from_phone: { type: string, example: '01712345678' }
        to_wallet_id: { type: string, format: uuid }
        to_phone: { type: string, example: '01712345678' }
        amount: { type: integer, format: int64 }
        fee: { type: integer, format: int64, description: Fee in poisha charged to the sender on top of amount (500 = 5 BDT by default; read from the fees table) }
        note: { type: [string, 'null'], maxLength: 255 }
        status: { type: string, enum: [COMPLETED] }
        created_at: { type: string, format: date-time }

    TransactionItemResponse:
      type: object
      description: One ledger entry (a debit or credit leg of a transaction)
      properties:
        entry_id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid, description: The transaction this entry belongs to; its debits equal its credits }
        wallet_id: { type: string, format: uuid }
        phone: { type: string, example: '01712345678' }
        type: { $ref: '#/components/schemas/EntryType' }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amount: { type: integer, format: int64 }
        balance_after: { type: integer, format: int64 }
        counterparty_wallet_id: { type: string, format: uuid }
        counterparty_phone: { type: string, example: '01712345678' }
        created_at: { type: string, format: date-time, description: 'When the entry was posted (after the wallet locks were taken), not when the request started' }

    TransactionDetailResponse:
      type: object
      properties:
        transaction_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TransactionType' }
        amount: { type: integer, format: int64, description: Principal moved; a transfer's fee is a separate pair of entries }
        gateway_ref: { type: [string, 'null'], format: uuid, description: Set for ADD_MONEY only }
        payment_method: { oneOf: [{ $ref: '#/components/schemas/PaymentMethod' }, { type: 'null' }] }
        note: { type: [string, 'null'], maxLength: 255, description: Set for TRANSFER only }
        created_at: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TransactionItemResponse' }

    TransactionPageResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TransactionItemResponse' }
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer, format: int64 }
        total_pages: { type: integer }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
