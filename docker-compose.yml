name: mini-wallet

services:
  postgres:
    image: postgres:18-alpine
    container_name: miniwallet-postgres
    environment:
      POSTGRES_DB: miniwallet
      POSTGRES_USER: miniwallet
      POSTGRES_PASSWORD: miniwallet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U miniwallet -d miniwallet" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mock payment gateway for Visa and Mastercard (WireMock). Stubs: docker/wiremock.
  payment-gateway:
    image: wiremock/wiremock:3.13.2
    container_name: miniwallet-payment-gateway
    command: ["--port", "8080", "--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

  # Spring Boot application: talks to PostgreSQL and the payment gateway.
  app:
    build: .
    image: mini-wallet-service:latest
    container_name: miniwallet-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/miniwallet
      DB_USERNAME: miniwallet
      DB_PASSWORD: miniwallet
      PAYMENT_GATEWAY_URL: http://payment-gateway:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payment-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
