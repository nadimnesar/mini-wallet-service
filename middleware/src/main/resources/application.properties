spring.application.name=mini-wallet-service

# --- PostgreSQL write node (primary) ---
miniwallet.datasource.write.jdbc-url=${DB_WRITE_URL:jdbc:postgresql://localhost:5432/miniwallet}
miniwallet.datasource.write.username=${DB_USERNAME:miniwallet}
miniwallet.datasource.write.password=${DB_PASSWORD:miniwallet}
miniwallet.datasource.write.driver-class-name=org.postgresql.Driver
miniwallet.datasource.write.pool-name=miniwallet-write
miniwallet.datasource.write.maximum-pool-size=10

# --- PostgreSQL read node (streaming replica) ---
miniwallet.datasource.read.jdbc-url=${DB_READ_URL:jdbc:postgresql://localhost:5433/miniwallet}
miniwallet.datasource.read.username=${DB_USERNAME:miniwallet}
miniwallet.datasource.read.password=${DB_PASSWORD:miniwallet}
miniwallet.datasource.read.driver-class-name=org.postgresql.Driver
miniwallet.datasource.read.pool-name=miniwallet-read
miniwallet.datasource.read.maximum-pool-size=10
miniwallet.datasource.read.read-only=true

# --- Payment gateway (Visa / Mastercard). Locally a WireMock mock: see docker/wiremock ---
miniwallet.payment-gateway.base-url=${PAYMENT_GATEWAY_URL:http://localhost:8089}
miniwallet.payment-gateway.connect-timeout=2s
miniwallet.payment-gateway.read-timeout=5s
miniwallet.payment-gateway.visa.api-key=visa-sandbox-key
miniwallet.payment-gateway.mastercard.api-key=mastercard-sandbox-key

# --- JSON: money fields must be exact integers (no 100.9 -> 100 truncation, no "100" strings) ---
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
