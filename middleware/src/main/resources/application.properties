spring.application.name=mini-wallet-service

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/miniwallet}
spring.datasource.username=${DB_USERNAME:miniwallet}
spring.datasource.password=${DB_PASSWORD:miniwallet}
spring.datasource.hikari.maximum-pool-size=10
# Milliseconds. Fail fast when the database is down, so the health probes answer 503 within seconds instead of hanging.
spring.datasource.hikari.connection-timeout=3000
# Per-connection server limits (application connections only, not Liquibase): a request that waits longer than 10 s
# for a row lock fails with 503 (the hot revenue/clearing rows are locked by every money movement), and a session
# that sits idle inside a transaction for 60 s is dropped so it cannot hold those locks forever.
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=10000 -c idle_in_transaction_session_timeout=60000
# Liquibase uses its own connection without those limits: it waits for the changelog lock while instances start together.
spring.liquibase.url=${spring.datasource.url}
spring.liquibase.user=${spring.datasource.username}
spring.liquibase.password=${spring.datasource.password}

# --- RabbitMQ: asynchronous add-money (work queue, retry queues with TTL, dead-letter queue) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:miniwallet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:miniwallet}
spring.rabbitmq.connection-timeout=2s
# A message is only reported as published once the broker confirmed it.
spring.rabbitmq.publisher-confirm-type=simple
# An unexpected listener error is dead-lettered instead of requeued forever; expected retries use the retry queues.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=1
# Wait before retry 1, 2, 3 ...; a request is tried retry-delays + 1 times, then it is FAILED and dead-lettered.
miniwallet.messaging.add-money.retry-delays=5s,30s,2m,10m,30m
miniwallet.messaging.add-money.dispatch-batch-size=50
miniwallet.messaging.add-money.dispatch-interval-ms=500
# Republish a PENDING request whose message was published longer ago than this and that was never attempted (a lost
# message). A request waiting on a retry queue is republished only after this plus the longest retry delay.
miniwallet.messaging.add-money.republish-after=10m
miniwallet.messaging.add-money.confirm-timeout=5s

# --- Payment gateway (Visa / Mastercard). Locally a WireMock mock: see docker/wiremock ---
miniwallet.payment-gateway.base-url=${PAYMENT_GATEWAY_URL:http://localhost:8089}
miniwallet.payment-gateway.connect-timeout=2s
miniwallet.payment-gateway.read-timeout=5s
miniwallet.payment-gateway.visa.api-key=visa-sandbox-key
miniwallet.payment-gateway.mastercard.api-key=mastercard-sandbox-key

# --- JSON: money fields must be exact integers (no 100.9 -> 100 truncation, no "100" strings) ---
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# --- Actuator: health only (liveness and readiness probes); nothing else is exposed, no details in the response ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Ready = the database answers. The broker is deliberately not part of it: with RabbitMQ down the service still
# accepts add-money (the outbox keeps the request until the broker is back), so it must stay in rotation.
management.endpoint.health.group.readiness.include=readinessState,db
